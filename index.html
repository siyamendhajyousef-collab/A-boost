<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التداول والأرباح الذكية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; direction: rtl; text-align: right; }
        .container { max-width: 480px; margin: 0 auto; background: #1e293b; min-height: 100vh; padding: 20px; position: relative; }
        h1, h2, h3 { color: #38bdf8; margin-bottom: 15px; }
        .card { background: #334155; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background: #0369a1; }
        input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
        .hidden { display: none !important; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0284c7; color: white; padding: 10px 20px; border-radius: 8px; z-index: 1000; transition: 0.3s; }
        .wheel-container { text-align: center; margin: 20px 0; }
        #spinWheelVisual { width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(#38bdf8 0deg 90deg, #0284c7 90deg 180deg, #bae6fd 180deg 270deg, #0369a1 270deg 360deg); margin: 0 auto 15px; transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
    </style>
</head>
<body>

<div class="container">
    <div id="toast" class="hidden toast"></div>

    <!-- شاشة تسجيل الدخول -->
    <div id="authScreen" class="card">
        <h2>تسجيل الدخول / إنشاء حساب</h2>
        <input type="email" id="authEmail" placeholder="البريد الإلكتروني">
        <input type="password" id="authPassword" placeholder="كلمة المرور">
        <button class="btn" onclick="login()">دخول</button>
        <button class="btn" style="background: #475569;" onclick="register()">حساب جديد</button>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="dashboardScreen" class="hidden">
        <div class="card">
            <h3>مرحباً بك</h3>
            <p>البريد: <span id="userEmailDisplay"></span></p>
            <p>المستوى: <span id="userTier">A1</span></p>
            <p>رصيد المحفظة الأساسي: <span id="walletBalance">0.00</span> $</p>
            <p>أرباح المهام (Asset Wallet): <span id="assetWallet">0.00</span> $</p>
            <button class="btn" style="background: #ef4444;" onclick="logout()">تسجيل الخروج</button>
        </div>

        <!-- شحن الرصيد والإيداع -->
        <div class="card">
            <h3>إيداع رصيد المحفظة</h3>
            <input type="number" id="depositAmount" placeholder="مبلغ الإيداع ($)">
            <button class="btn" onclick="confirmDeposit()">تأكيد الإيداع</button>
        </div>

        <!-- عجلة الحظ -->
        <div class="card wheel-container">
            <h3>عجلة الحظ الكبرى</h3>
            <div id="spinWheelVisual"></div>
            <button class="btn" onclick="triggerQuerySpin()">تدوير العجلة (ربح 5$)</button>
        </div>

        <!-- الصندوق المفاجئ -->
        <div class="card" style="text-align: center;">
            <h3>الصندوق المفاجئ</h3>
            <button class="btn" style="background: #10b981;" onclick="openMysteryBox()">فتح الصندوق (ربح 10$)</button>
        </div>

        <!-- إنجاز المهام -->
        <div class="card">
            <h3>المهام اليومية</h3>
            <p>المهام المنجزة اليوم: <span id="completedTasks">0</span></p>
            <button class="btn" style="background: #8b5cf6;" onclick="completeTask()">إنجاز مهمة</button>
        </div>

        <!-- السحب -->
        <div class="card">
            <h3>طلب سحب الأرباح</h3>
            <input type="number" id="withdrawAmount" placeholder="المبلغ المراد سحبه">
            <input type="text" id="withdrawWallet" placeholder="عنوان محفظة USDT">
            <button class="btn" style="background: #f59e0b;" onclick="submitWithdraw()">سحب الأرباح</button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (token) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');
        loadUserProfile();
    }

    function showToast(message) {
        const t = document.getElementById('toast');
        t.innerText = message;
        t.classList.remove('hidden');
        setTimeout(() => t.classList.add('hidden'), 3000);
    }

    async function login() {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('token', data.token);
                showToast('تم تسجيل الدخول بنجاح');
                location.reload();
            } else {
                showToast(data.error || 'فشل تسجيل الدخول');
            }
        } catch (err) {
            showToast('خطأ في الاتصال بالخادم');
        }
    }

    async function register() {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            });
            const data = await res.json();
            if (res.ok) {
                showToast('تم إنشاء الحساب بنجاح، يمكنك تسجيل الدخول الآن');
            } else {
                showToast(data.error || 'فشل التسجيل');
            }
        } catch (err) {
            showToast('خطأ في الاتصال بالخادم');
        }
    }

    async function loadUserProfile() {
        const tk = localStorage.getItem('token');
        try {
            const res = await fetch('/api/user/profile', {
                headers: {'Authorization': `Bearer ${tk}`}
            });
            const data = await res.json();
            if (res.ok) {
                const u = data.user;
                document.getElementById('userEmailDisplay').innerText = u.email;
                document.getElementById('userTier').innerText = u.tierCode;
                document.getElementById('assetWallet').innerText = (u.assetWallet || 0).toFixed(2);
                document.getElementById('walletBalance').innerText = (u.wallet && u.wallet.balance ? u.wallet.balance : 0).toFixed(2);
                document.getElementById('completedTasks').innerText = u.todayCompletedTasks || 0;
            }
        } catch (err) {
            console.error(err);
        }
    }

    async function confirmDeposit() {
        const amount = parseFloat(document.getElementById('depositAmount').value);
        if (!amount || amount <= 0) {
            showToast('يرجى إدخال مبلغ إيداع صحيح');
            return;
        }
        const tk = localStorage.getItem('token');
        try {
            const res = await fetch('/api/wallet/deposit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${tk}`},
                body: JSON.stringify({ amount })
            });
            const data = await res.json();
            if (res.ok) {
                showToast('تم إيداع الرصيد بنجاح');
                document.getElementById('depositAmount').value = '';
                loadUserProfile();
            } else {
                showToast(data.error || 'خطأ في عملية الإيداع');
            }
        } catch (err) {
            showToast('خطأ في الاتصال بالخادم');
        }
    }

    async function triggerQuerySpin() {
        const wheel = document.getElementById('spinWheelVisual');
        wheel.style.transform = `rotate(${Math.floor(Math.random() * 1000 + 720)}deg)`;
        const tk = localStorage.getItem('token');
        try {
            const res = await fetch('/api/rewards/claim', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${tk}`},
                body: JSON.stringify({ amount: 5.00 })
            });
            if (res.ok) {
                setTimeout(() => {
                    showToast('مبروك! ربحت 5.00$ من عجلة الحظ وأضيفت لمحفظتك');
                    loadUserProfile();
                }, 1000);
            } else {
                showToast('خطأ في حفظ الجائزة');
            }
        } catch (err) {
            showToast('خطأ في الاتصال بالخادم');
        }
    }

    async function openMysteryBox() {
        const tk = localStorage.getItem('token');
        try {
            const res = await fetch('/api/rewards/claim', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${tk}`},
                body: JSON.stringify({ amount: 10.00 })
            });
            if (res.ok) {
                showToast('🎁 مبروك! فتحت الصندوق وربحت 10.00$ أضيفت لمحفظتك!');
                loadUserProfile();
            } else {
                showToast('خطأ في فتح الصندوق');
            }
        } catch (err) {
            showToast('خطأ في الاتصال');
        }
    }

    async function completeTask() {
        const tk = localStorage.getItem('token');
        try {
            const res = await fetch('/api/tasks/complete', {
                method: 'POST',
                headers: {'Authorization': `Bearer ${tk}`}
            });
            const data = await res.json();
            if (res.ok) {
                showToast('تم إنجاز المهمة بنجاح وإضافة العمولة');
                loadUserProfile();
            } else {
                showToast(data.error || 'خطأ في إنجاز المهمة');
            }
        } catch (err) {
            showToast('خطأ في الاتصال بالخادم');
        }
    }

    async function submitWithdraw() {
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const walletAddress = document.getElementById('withdrawWallet').value;
        const tk = localStorage.getItem('token');
        if (!amount || !walletAddress) {
            showToast('يرجى إدخال المبلغ وعنوان المحفظة');
            return;
        }
        try {
            const res = await fetch('/api/wallet/withdraw', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${tk}`},
                body: JSON.stringify({ amount, walletAddress })
            });
            const data = await res.json();
            if (res.ok) {
                showToast('تم تقديم طلب السحب بنجاح');
                loadUserProfile();
            } else {
                showToast(data.error || 'خطأ في طلب السحب');
            }
        } catch (err) {
            showToast('خطأ في الاتصال بالخادم');
        }
    }

    function logout() {
        localStorage.removeItem('token');
        location.reload();
    }
</script>

</body>
</html>
